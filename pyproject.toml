[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgr"
version = "0.1.0"
description = "BRIDGR scaffold for BPMN to EA knowledge graph processing."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "app",
    "app_config",
    "cmdb",
    "env_loader",
    "knowledge_base",
    "llm_client",
    "main",
    "pipeline",
    "run_artifacts",
    "ui_run_view",
]

[tool.setuptools.packages.find]
include = ["skills*"]
