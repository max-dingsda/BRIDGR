[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgr"
version = "0.1.0"
description = "BRIDGR scaffold for BPMN to EA knowledge graph processing."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.45,<2.0",
    "neo4j>=5.0,<6.0",
    "requests>=2.31,<3.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
addopts = "--basetemp=.pytest_tmp"

[tool.setuptools]
py-modules = ["app", "main"]

[tool.setuptools.packages.find]
include = ["core*", "processing*", "skills*", "ui*", "services*"]
